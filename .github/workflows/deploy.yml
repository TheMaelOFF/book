name: Deploy to Static.app

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy to Static.app
        # CORRECTION ICI : on a remplacé @v1 par @main
        uses: designmodo/static-app-deploy-action@main
        with:
          api_key: ${{ secrets.STATIC_APP_API_KEY }}
          root_directory: '.'
