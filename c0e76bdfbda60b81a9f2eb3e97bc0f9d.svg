<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="479.84375" height="361.5" viewBox="0,0,479.84375,361.5"><g transform="translate(-1.25,0.75)"><g stroke-miterlimit="10"><path d="M1.5,360.5v-361h477v361z" fill="#000000" stroke="#000000" stroke-width="0.5"/><text transform="translate(17.5,21.5) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="&quot;Carlito&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Idées pour le jeu :</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">- Faire un lecteur mp3 dans la boutique avec</tspan><tspan x="0" dy="46.15px">2-3 musiques de ma composition.</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">- Faire un mini jeu/rêve accessible durant la nuit </tspan><tspan x="0" dy="46.15px">grâçe à une pillule pour le sommeil au magasin</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">- Faire des mini consoles à acheter au magasin</tspan><tspan x="0" dy="46.15px">pour jouer à des petits jeux chez soi</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">- Possibilité d'acheter des tournevis etc pour</tspan><tspan x="0" dy="46.15px">trouver du lore dans les différentes parties du</tspan><tspan x="0" dy="46.15px">jeu ou même trouver de l'argent.</tspan></text></g></g></svg>