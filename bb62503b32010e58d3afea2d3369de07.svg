<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="47.2" height="409.91606" viewBox="0,0,47.2,409.91606"><g transform="translate(-216.4,35.9093)"><g stroke-miterlimit="10"><path d="M218.15196,83.83395v-119.74325h44.23948v119.74325z" fill="#000000" stroke="#000000" stroke-width="0"/><path d="M216.9,37.80443v-13.63838h46.2v13.63838z" fill="#000000" stroke="#ffffff" stroke-width="1"/><text transform="translate(220.28418,30.61334) scale(0.09008,0.09008)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="&quot;Noto Sans Georgian&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">COOKING TUTORIAL </tspan><tspan x="0" dy="46.150000000000006px">FAIL</tspan></text><path d="M218.15196,143.83395v-57.59019h44.23948v57.59019z" fill="#000000" stroke="#000000" stroke-width="0"/><text transform="translate(220.15218,101.07553) scale(0.05016,0.05016)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="&quot;Noto Sans Georgian&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">By AnnoyingDog</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">The dev left the script for the final boss on</tspan><tspan x="0" dy="48px">the desk. I ate it. Game over, you can all go </tspan><tspan x="0" dy="48px">home now. The boss was too hard anyway </tspan><tspan x="0" dy="48px">and the music didn't have enough barks in </tspan><tspan x="0" dy="48px">it. Bork.</tspan></text><path d="M227.55272,139.5939v-15.90925h24.62145v15.90925z" fill="#000000" stroke="#ffffff" stroke-width="0.5"/><text transform="translate(228.43657,127.34644) scale(0.04457,0.05543)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="&quot;Noto Sans Georgian&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Image of a dog</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Description made by our AI</tspan><tspan x="0" dy="46.150000000000006px">to fulfill your lack of </tspan><tspan x="0" dy="46.150000000000006px">connection.</tspan></text><path d="M216.9,97.80443v-13.63838h46.2v13.63838z" fill="#000000" stroke="#ffffff" stroke-width="1"/><text transform="translate(220.28418,90.61334) scale(0.09008,0.09008)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="&quot;Noto Sans Georgian&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">SYSTEM UPDATE</tspan></text><path d="M218.15196,203.44933v-57.59019h44.23948v57.59019z" fill="#000000" stroke="#000000" stroke-width="0"/><path d="M216.9,157.41981v-13.63838h46.2v13.63838z" fill="#000000" stroke="#ffffff" stroke-width="1"/><text transform="translate(220.28418,150.22872) scale(0.09008,0.09008)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="&quot;Noto Sans Georgian&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">HEY CRISTAL LOOK </tspan><tspan x="0" dy="46.150000000000006px">OVER HERE ITS US</tspan></text><path d="M218.15196,374.00676v-168.53223h44.23948v168.53223z" fill="#000000" stroke="#000000" stroke-width="0"/><path d="M216.9,217.0352v-13.63838h46.2v13.63838z" fill="#000000" stroke="#ffffff" stroke-width="1"/><text transform="translate(220.28418,209.84411) scale(0.09008,0.09008)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="&quot;Noto Sans Georgian&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">CRYPTO INVESTMUNT</tspan></text><text transform="translate(220.40471,220.3252) scale(0.05016,0.05016)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="&quot;Noto Sans Georgian&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">By Tem_Goes_To_Colleg</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">h0I!!! i went to COOL LEG to lern da bizness!!</tspan><tspan x="0" dy="48px">i hav SPECIAL offer just 4 u !!! gimme 1000G </tspan><tspan x="0" dy="48px">and i giv u... dis Temmie Flake (its just colord </tspan><tspan x="0" dy="48px">construction paper). ITS LIMITID OFFER !!! </tspan><tspan x="0" dy="48px">my parents r proud of me.</tspan></text><text transform="translate(225.95721,311.66985) scale(0.07451,0.05516)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">I don't know what you're</tspan><tspan x="0" dy="46.150000000000006px">talking about...</tspan></text><text transform="translate(223.66124,6.76847) scale(0.06909,0.06909)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Release to load new posts</tspan></text><g><text transform="translate(220.15218,41.09443) scale(0.05016,0.05016)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="&quot;Noto Sans Georgian&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">By SkelePun_Standup</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Tried to eat my bro's spaghetti just to be </tspan><tspan x="0" dy="48px">supportive. Forgot a minor technical detail: </tspan><tspan x="0" dy="48px">lack of stomach. The noodles just phased </tspan><tspan x="0" dy="48px">right through my ribcage onto the carpet. </tspan><tspan x="0" dy="48px">The dog absorbed them instantly. It's </tspan><tspan x="0" dy="48px">floating now. Send help.</tspan></text><path d="M227.55272,79.6128v-15.90925h24.62145v15.90925z" fill="#000000" stroke="#ffffff" stroke-width="0.5"/><text transform="translate(228.43656,67.36534) scale(0.04457,0.05542)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="&quot;Noto Sans Georgian&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Image of a skeleton, he </tspan><tspan x="0" dy="46.150000000000006px">seems tall.</tspan><tspan x="0" dy="46.150000000000006px">Description made by our AI</tspan><tspan x="0" dy="46.150000000000006px">to fulfill your lack of </tspan><tspan x="0" dy="46.150000000000006px">connection.</tspan></text></g><text transform="translate(220.15218,161.44235) scale(0.05016,0.05016)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="&quot;Noto Sans Georgian&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">It's me, CHILD</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Okay, I'm sure you've seen that your phone</tspan><tspan x="0" dy="48px">messages are blocked, I've tried to unblock </tspan><tspan x="0" dy="48px">you from here but it's impossible. Obscura</tspan><tspan x="0" dy="48px">has decided to block your messages, I don't</tspan><tspan x="0" dy="48px">know if they know anything about our plan</tspan><tspan x="0" dy="48px">but be reassured, I can still see through </tspan><tspan x="0" dy="48px">your eyes, I'll contact you wherever I can.</tspan><tspan x="0" dy="48px">Be careful, continue the good work !</tspan></text><path d="M227.55272,199.96072v-15.90925h24.62145v15.90925z" fill="#000000" stroke="#ffffff" stroke-width="0.5"/><text transform="translate(228.43657,187.71326) scale(0.04457,0.05543)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="&quot;Noto Sans Georgian&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Image of why tf is that </tspan><tspan x="0" dy="46.150000000000006px">required ???</tspan><tspan x="0" dy="46.150000000000006px">Description made by our AI</tspan><tspan x="0" dy="46.150000000000006px">to fulfill your lack of </tspan><tspan x="0" dy="46.150000000000006px">connection.</tspan></text><path d="M227.55272,258.7879v-15.90925h24.62145v15.90925z" fill="#000000" stroke="#ffffff" stroke-width="0.5"/><text transform="translate(228.43657,246.54045) scale(0.04457,0.05543)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="&quot;Noto Sans Georgian&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Image of a poorly drawn</tspan><tspan x="0" dy="46.150000000000006px">white creature.</tspan><tspan x="0" dy="46.150000000000006px">Description made by our </tspan><tspan x="0" dy="46.150000000000006px">dev to fulfil his need of</tspan><tspan x="0" dy="46.150000000000006px">insulting kids.</tspan></text></g></g></svg>